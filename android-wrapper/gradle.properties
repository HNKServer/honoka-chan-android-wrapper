# Required because Material Components 1.12.0 depends on AndroidX.
android.useAndroidX=true

# Not strictly required for this wrapper, but harmless if future dependencies still reference old support libs.
android.enableJetifier=true

# Give Gradle a bit more heap for Android Studio/AGP builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
